<title>鑑識</title>
<link rel="stylesheet" referrerpolicy="no-referrer"
  href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#EDEFF6; --surface:#FFFFFF; --sunk:#E3E6F0;
  --ink:#161A2C; --ink-soft:#4C5372; --muted:#818AAB;
  --line:#D6DAE8; --line-soft:#E6E9F2;
  --blue:#3A5BC0; --blue-wash:#E5EAF9;
  --gold:#A9711A; --gold-wash:#F7EEDC;
  --hp:#B93A34; --hp-wash:#FAE8E7; --ok:#3E7D5B;
  --shadow:0 2px 0 var(--line);
  --win-bg:#0A0B14; --win-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1120; --surface:#181C30; --sunk:#141829;
    --ink:#EDEFF8; --ink-soft:#B3BAD4; --muted:#7E87A6;
    --line:#2A3050; --line-soft:#212640;
    --blue:#8CA6F5; --blue-wash:#1B2244;
    --gold:#E0B056; --gold-wash:#2A2214;
    --hp:#EB7C75; --hp-wash:#33191A; --ok:#7FC29C;
    --shadow:0 2px 0 var(--line);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1120; --surface:#181C30; --sunk:#141829;
  --ink:#EDEFF8; --ink-soft:#B3BAD4; --muted:#7E87A6;
  --line:#2A3050; --line-soft:#212640;
  --blue:#8CA6F5; --blue-wash:#1B2244;
  --gold:#E0B056; --gold-wash:#2A2214;
  --hp:#EB7C75; --hp-wash:#33191A; --ok:#7FC29C;
  --shadow:0 2px 0 var(--line);
}
*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  font-size:15px; line-height:1.85; margin:0; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:940px;margin:0 auto;padding:0 24px}
h1,h2,h3,.dot{font-family:"DotGothic16","Zen Kaku Gothic New",monospace;font-weight:400;margin:0;text-wrap:balance}
code,.mono{font-family:"JetBrains Mono","Zen Kaku Gothic New",ui-monospace,monospace;font-size:.86em}
a{color:var(--blue)}
b{font-weight:500}

/* ---- うわばり（部屋を行き来する） */
.bar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:2px solid var(--line)}
.bar-in{max-width:940px;margin:0 auto;padding:7px 24px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.bar .home{font-family:"DotGothic16",monospace;font-size:14px;color:var(--ink);text-decoration:none;margin-right:10px;letter-spacing:.06em}
.bar a.nav{font-family:"DotGothic16",monospace;font-size:13px;color:var(--ink-soft);text-decoration:none;padding:2px 9px;border:1px solid transparent}
.bar a.nav:hover{border-color:var(--line);background:var(--sunk)}
.bar a.nav.on{color:var(--blue);border-color:var(--blue);background:var(--blue-wash)}
.bar form{margin-left:auto;display:flex}
.bar input{
  font-family:"DotGothic16",monospace;font-size:13px;background:var(--sunk);
  border:2px solid var(--line);color:var(--ink);padding:3px 10px;width:min(40vw,250px);
}
.bar input:focus{outline:none;border-color:var(--blue)}

.head{padding:44px 0 34px}
.kicker{font-family:"DotGothic16",monospace;font-size:12px;letter-spacing:.14em;color:var(--blue);margin:0 0 12px}
.head h1{font-size:clamp(26px,5vw,44px);line-height:1.35;letter-spacing:.02em}
.head .sub{color:var(--ink-soft);margin:16px 0 0;max-width:62ch}

.status{margin-top:30px}
.st-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:5px 28px;
  font-family:"DotGothic16",monospace;font-size:14px;
}
.st-grid div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted rgba(255,255,255,.22);padding:3px 0}
.st-grid span{color:#A8B2D8}
.st-grid b{font-weight:400;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.win{
  background:var(--win-bg); color:var(--win-ink); border:3px solid #fff; padding:22px 26px;
  box-shadow:0 0 0 3px var(--win-bg),0 0 0 5px rgba(255,255,255,.22); margin:5px;
}

section{padding:44px 0;border-top:2px solid var(--line)}
section:first-child{border-top:0}
.sec-head{margin-bottom:24px}
.sec-head .kicker{color:var(--muted)}
.sec-head h2{font-size:25px;letter-spacing:.03em}
.sec-head p{color:var(--ink-soft);margin:12px 0 0;max-width:64ch}

/* アイボ（ドット絵） */
/* 幅は 26 の倍数にする。半端だとドットの境目がにじむ */
.aibo{width:104px;height:auto;flex:none;overflow:visible;image-rendering:pixelated}
.aibo.small{width:78px}
.aibo .f2,.aibo .blink{opacity:0}
@keyframes aibo-a{0%,49.9%{opacity:1}50%,100%{opacity:0}}
@keyframes aibo-b{0%,49.9%{opacity:0}50%,100%{opacity:1}}
@keyframes aibo-blink{0%,2.4%{opacity:1}2.5%,100%{opacity:0}}
.aibo .f1{animation:aibo-a 1.8s steps(1,end) infinite}
.aibo .f2{animation:aibo-b 1.8s steps(1,end) infinite}
.aibo .blink{animation:aibo-blink 5.6s steps(1,end) infinite}
/* 動くのが邪魔な人には、こま1枚で座っていてもらう */
@media (prefers-reduced-motion: reduce){
  .aibo .f1,.aibo .f2,.aibo .blink{animation:none}
  .aibo .f1{opacity:1}
}
.aibo-who{margin-top:3px;text-align:center;font-family:"DotGothic16",monospace;font-size:11.5px;color:var(--muted);letter-spacing:.1em}
.aibo-side{display:flex;gap:20px;align-items:flex-start;margin:0 5px}
.aibo-side .diary{margin:0;flex:1;min-width:0}
.aibo-row{display:flex;gap:18px;align-items:flex-start}
.aibo-row .sec-head{flex:1;min-width:0;margin-bottom:0}
@media (max-width:620px){
  .aibo-side{flex-direction:column;gap:12px}
  .aibo{width:78px}
}

/* アイボが書いたもの（日記と、株の見立て）。どちらも段落だけの文書 */
.diary,.midate{background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow);padding:24px 28px;margin:0 5px}
.diary p,.midate p{margin:0 0 1.15em;line-height:2.05}
.diary p:last-child,.midate p:last-child{margin-bottom:0}
/* 日記を読んだ人が返したもの。日記より一段ひかえめに */
.said{display:flex;gap:20px;align-items:flex-start;margin:26px 5px 0}
.said-who{flex:none;width:78px}
.said-body{flex:1;min-width:0;border-left:3px solid var(--line);padding:2px 0 2px 18px}
.said .who{color:var(--muted);font-size:12px;letter-spacing:.04em;margin:0 0 8px}
.said p{margin:0 0 1em;line-height:1.95}
.said p:last-child{margin-bottom:0}
.said-tag{flex:none;padding:0 7px;font-size:11px;white-space:nowrap;
  color:var(--ink-soft);background:var(--blue-wash);border:1px solid var(--line)}

/* 年表（出来事）。間取りは kani.show から借りた —— 月で束ねて、
   日付・名前・一言の3つで1行にする。★ はその月でいちばん大きいもの */
.nen-y{display:flex;align-items:baseline;gap:14px;margin:40px 0 14px;padding-bottom:7px;
  border-bottom:2px solid var(--line)}
.nen-y:first-child{margin-top:8px}
.nen-y h3{font-size:27px;letter-spacing:.05em}
.nen-y .n{color:var(--muted);font-size:12.5px}
.nen-y .go{margin-left:auto;font-size:12.5px;font-family:"DotGothic16",monospace;text-decoration:none}
.nen-m{display:grid;grid-template-columns:78px 1fr;gap:0 16px;align-items:start}
.nen-mon{font-family:"DotGothic16",monospace;font-size:14px;color:var(--ink-soft);
  text-align:right;padding:9px 0 0;position:sticky;top:56px}
.nen-mon i{display:block;font-style:normal;font-size:11px;color:var(--muted)}
.nen-in{border-left:2px solid var(--line);padding:4px 0 20px}
.nen-lead{color:var(--muted);font-size:12.5px;line-height:1.75;margin:0 0 4px;padding:4px 0 4px 20px}
.nen-tail{color:var(--ink-soft);font-size:12.5px;line-height:1.75;margin:6px 0 0;
  padding:7px 0 0 20px;border-top:1px dashed var(--line-soft)}
.ev{display:block;position:relative;padding:5px 8px 5px 20px;color:inherit;text-decoration:none}
.ev::before{content:"";position:absolute;left:-5px;top:15px;width:8px;height:8px;
  background:var(--line);border:2px solid var(--ground)}
.ev:hover{background:var(--sunk)}
.ev time{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);margin-right:10px}
.ev b{font-weight:500}
.ev .say{color:var(--ink-soft);font-size:13px;margin-left:8px}
.ev.big::before{left:-7px;top:13px;width:12px;height:12px;background:var(--blue)}
.ev.big b{color:var(--blue);font-size:16.5px}
.ev.big .say{color:var(--ink)}
@media (max-width:620px){
  .nen-m{grid-template-columns:1fr;gap:0}
  .nen-mon{text-align:left;position:static;padding:12px 0 2px}
  .nen-mon i{display:inline;margin-left:8px}
}

/* こんしゅうの 週報 */
.report{border:3px solid var(--ok);background:var(--surface);padding:22px 26px;margin:0 5px}
.report .o-title{font-family:"DotGothic16",monospace;font-size:17px;color:var(--ok);letter-spacing:.03em}
.report .o-when{font-size:12.5px;color:var(--muted);margin-top:2px;font-family:"DotGothic16",monospace}
.o-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px 34px;margin-top:20px}
.o-sec h3{font-size:14px;color:var(--blue);letter-spacing:.05em;margin-bottom:4px}
.o-sec ul{margin:0 0 18px;padding-left:1.2em}
.o-sec li{font-size:13.5px;color:var(--ink-soft);line-height:1.75}
.o-sec p{font-size:13.5px;color:var(--ink-soft);margin:0 0 16px}
.o-sec li b,.o-sec p b{color:var(--ink)}
.more{font-family:"DotGothic16",monospace;font-size:12.5px;margin-top:14px}
.more .when{color:var(--muted)}

/* スキル */
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.tk{background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow);padding:14px 16px;text-decoration:none;color:var(--ink);display:block}
a.tk:hover{border-color:var(--blue)}
.tk .tk-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tk .tk-name{font-family:"DotGothic16",monospace;font-size:16px;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk .tk-star{color:var(--gold);font-size:12px;letter-spacing:.08em;flex:none}
.tk .tk-star i{color:var(--line);font-style:normal}
.tk .tk-when{font-family:"DotGothic16",monospace;font-size:12px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.tk .tk-num{font-size:12px;color:var(--ink-soft);margin-top:1px;font-variant-numeric:tabular-nums}

/* ならんだ棒 */
.bars{background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow);padding:16px 18px}
.bar-row{display:grid;grid-template-columns:120px 1fr auto;gap:14px;align-items:center;padding:2px 0;text-decoration:none;color:var(--ink)}
a.bar-row:hover .b-name{color:var(--blue)}
.bar-row .b-name{font-family:"DotGothic16",monospace;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .b-track{height:12px;background:var(--sunk);border:1px solid var(--line);position:relative}
.bar-row .b-fill{position:absolute;inset:0 auto 0 0;background:var(--blue)}
.bar-row .b-fill.gold{background:var(--gold)}
.bar-row .b-num{font-family:"DotGothic16",monospace;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:5.5em;text-align:right}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.two h3{font-size:15px;margin-bottom:10px;letter-spacing:.03em}
.two h3::before{content:"▶ ";color:var(--blue);font-size:11px;vertical-align:2px}

/* あゆみ */
.tbl-scroll{overflow-x:auto;border:2px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:13.5px}
th,td{text-align:left;padding:8px 16px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
thead th{font-family:"DotGothic16",monospace;font-size:13px;letter-spacing:.06em;color:var(--muted);background:var(--sunk);border-bottom:2px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--sunk)}
td.year{font-family:"DotGothic16",monospace;font-size:15px;color:var(--blue);font-variant-numeric:tabular-nums;white-space:nowrap}
td.num{font-family:"DotGothic16",monospace;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;width:1%}
td.graph{width:38%}
td.main{color:var(--ink-soft);font-size:12.5px}
.mini{height:10px;background:var(--sunk);border:1px solid var(--line);position:relative;min-width:80px}
.mini i{position:absolute;inset:0 auto 0 0;background:var(--blue);display:block}
.mini i.gold{background:var(--gold)}

/* いる ばしょ */
.basho{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:12px}
.bs{background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow);padding:14px 16px;border-left:3px solid var(--blue);text-decoration:none;color:var(--ink);display:block}
a.bs:hover{border-color:var(--blue)}
.bs .bs-name{font-family:"DotGothic16",monospace;font-size:14.5px;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bs .bs-when{font-family:"DotGothic16",monospace;font-size:12px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.bs .bs-num{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

/* ならんだ行（一覧・部屋の中） */
.rows{background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow)}
.row{display:flex;gap:14px;align-items:baseline;padding:6px 16px;border-bottom:1px solid var(--line-soft);text-decoration:none;color:var(--ink)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--sunk)}
.row .r-key{font-family:"DotGothic16",monospace;font-size:13.5px;color:var(--blue);white-space:nowrap;font-variant-numeric:tabular-nums}
.row .r-body{flex:1;font-size:13.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r-num{font-family:"DotGothic16",monospace;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .r-track{width:120px;height:9px;background:var(--sunk);border:1px solid var(--line);position:relative;flex:none}
.row .r-track i{position:absolute;inset:0 auto 0 0;background:var(--blue)}
.dirs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:18px}
.dir{background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow);padding:10px 14px;text-decoration:none;color:var(--ink)}
.dir:hover{border-color:var(--blue)}
.dir .d-name{font-family:"DotGothic16",monospace;font-size:14px}
.dir .d-num{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* 1枚を読む */
.crumb{font-family:"DotGothic16",monospace;font-size:12.5px;color:var(--muted);margin-bottom:10px;word-break:break-all}
.crumb a{text-decoration:none}
.crumb a:hover{text-decoration:underline}
.fm{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0 0}
.fm span{font-family:"DotGothic16",monospace;font-size:11.5px;background:var(--sunk);border:1px solid var(--line);color:var(--ink-soft);padding:0 8px}
.doc{background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow);padding:24px 30px;overflow-wrap:anywhere}
.doc h3.md-h{font-size:18px;color:var(--blue);margin:26px 0 8px;letter-spacing:.03em}
.doc h4.md-h{font-size:15px;color:var(--gold);margin:20px 0 6px;letter-spacing:.03em}
.doc h5.md-h,.doc h6.md-h{font-size:14px;color:var(--ink-soft);margin:16px 0 4px}
.doc>*:first-child{margin-top:0}
.doc p{margin:0 0 1.05em}
.doc ul,.doc ol{margin:0 0 1.05em;padding-left:1.4em}
.doc li{margin:2px 0}
.doc li.lv1{margin-left:1.4em}
.doc li.lv2{margin-left:2.8em}
.doc li.lv3{margin-left:4.2em}
.doc blockquote{margin:0 0 1.05em;padding:4px 0 4px 16px;border-left:3px solid var(--line);color:var(--ink-soft)}
.doc hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.doc pre.code{background:var(--sunk);border:1px solid var(--line);padding:12px 14px;overflow-x:auto;margin:0 0 1.05em}
.doc pre.code code{font-size:12.5px;line-height:1.7;white-space:pre}
.doc .tbl-scroll{margin:0 0 1.05em}
.doc table{min-width:0}
.raw{background:var(--sunk);border:2px solid var(--line);padding:16px 18px;overflow-x:auto}
.raw pre{margin:0;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12.5px;line-height:1.75;white-space:pre-wrap;word-break:break-all}
.tools{display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap}
.btn{
  font-family:"DotGothic16",monospace;font-size:12.5px;background:var(--surface);
  border:2px solid var(--line);box-shadow:var(--shadow);color:var(--ink-soft);
  padding:2px 12px;cursor:pointer;text-decoration:none;
}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.on{border-color:var(--blue);color:var(--blue);background:var(--blue-wash)}

/* さがす */
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:18px}
.hit{display:block;background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow);padding:12px 16px;margin-bottom:9px;text-decoration:none;color:var(--ink)}
.hit:hover{border-color:var(--blue)}
.hit .h-where{font-family:"DotGothic16",monospace;font-size:12px;color:var(--blue);letter-spacing:.03em}
.hit .h-head{font-size:14px;margin-top:1px}
.hit .h-snip{font-size:13px;color:var(--ink-soft);margin-top:4px;line-height:1.75}
mark{background:var(--gold-wash);color:var(--ink);border-bottom:1px solid var(--gold)}

.foot{padding:30px 0 60px;color:var(--muted);font-size:12.5px}
.foot code{color:var(--ink-soft)}
.err{color:var(--hp)}
.note{color:var(--muted);font-size:12.5px;margin:0 0 16px}
</style>

<script>
"use strict";

// ---------------------------------------------------------------- 字にする

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function num(v) { return (v || 0).toLocaleString("en-US"); }
function u(s) { return encodeURIComponent(String(s == null ? "" : s)); }
function escRe(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
/** esc() を戻す。行き先を組むときだけ要る（描くのは escape したまま） */
function unesc(s) {
  return String(s).replace(/&(amp|lt|gt|quot|#39);/g, function (m, k) {
    return { amp: "&", lt: "<", gt: ">", quot: '"', "#39": "'" }[k];
  });
}
/** 住所は decode しすぎない。素の日本語が来ても落ちないように */
function unurl(s) {
  try { return decodeURIComponent(s); } catch (e) { return s; }
}

/** 拠点の中身は必ずここを通す。会話原文には HTML も script も入っている */
var RE_INLINE = /`([^`]+)`|\*\*([^*]+)\*\*|\[\[([^\]|]+)(?:\|[^\]]*)?\]\]|\[([^\]]+)\]\((https?:[^)\s]+)\)|(https?:\/\/[^\s<)]+)/g;

function inline(text) {
  // 印を入れてからエスケープすると印まで消える（落とし穴35）。先に escape する
  return esc(text).replace(RE_INLINE, function (m, code, bold, wiki, label, href, bare) {
    if (code != null) return '<code class="mono">' + code + "</code>";
    if (bold != null) return "<b>" + bold + "</b>";
    if (wiki != null) return '<a href="#/search/' + u(unesc(wiki)) + '">' + wiki + "</a>";
    if (label != null) return '<a href="' + href + '" target="_blank" rel="noreferrer">' + label + "</a>";
    return '<a href="' + bare + '" target="_blank" rel="noreferrer">' + bare + "</a>";
  });
}

/** 検索語を光らせる。エスケープ済みの字に当てる */
function light(escaped, words) {
  if (!words || !words.length) return escaped;
  var pat = new RegExp(words.slice().sort(function (a, b) { return b.length - a.length; })
    .map(function (w) { return escRe(esc(w)); }).join("|"), "gi");
  return escaped.replace(pat, function (m) { return "<mark>" + m + "</mark>"; });
}

/** 見出しの無い文書（日記）。空行で段落に割る */
function paragraphs(text) {
  return String(text || "").split(/\n\s*\n/)
    .map(function (p) { return p.trim(); })
    .filter(Boolean)
    .map(function (p) { return "<p>" + inline(p) + "</p>"; })
    .join("");
}

/** 週報の節。箇条書きと段落だけ描く */
function lines(rows) {
  var out = [];
  var ul = [];
  function flush() {
    if (!ul.length) return;
    out.push("<ul>" + ul.map(function (t) { return "<li>" + inline(t) + "</li>"; }).join("") + "</ul>");
    ul = [];
  }
  rows.forEach(function (raw) {
    var line = raw.trim();
    if (!line) { flush(); return; }
    if (/^-\s+/.test(line)) { ul.push(line.replace(/^-\s+/, "")); return; }
    flush();
    out.push("<p>" + inline(line) + "</p>");
  });
  flush();
  return out.join("");
}

// ---------------------------------------------------------------- 拠点の書式

var RE_BLOCK = /^\s*(```|\||#{1,6}\s|>|[-*]\s|\d+\.\s|-{3,}\s*$)/;

function mdTable(rows) {
  var cells = rows.map(function (r) {
    return r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (c) { return c.trim(); });
  });
  var head = null;
  if (cells.length > 1 && cells[1].every(function (c) { return /^:?-{2,}:?$/.test(c); })) {
    head = cells.shift();
    cells.shift();
  }
  var out = ['<div class="tbl-scroll"><table>'];
  if (head) {
    out.push("<thead><tr>" + head.map(function (c) { return "<th>" + inline(c) + "</th>"; }).join("") + "</tr></thead>");
  }
  out.push("<tbody>" + cells.map(function (row) {
    return "<tr>" + row.map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>";
  }).join("") + "</tbody></table></div>");
  return out.join("");
}

/**
 * 拠点にある書式だけを描く。凝った Markdown は書かれていない
 * （書いているのは道具で、人間ではない）。
 */
function md(text) {
  var src = String(text || "").replace(/\r/g, "").split("\n");
  var out = [];
  var kind = null; // 開いている箇条書き
  var i = 0;

  function close() { if (kind) { out.push(kind === "ul" ? "</ul>" : "</ol>"); kind = null; } }
  function open(want) { if (kind !== want) { close(); out.push(want === "ul" ? "<ul>" : "<ol>"); kind = want; } }
  function depth(s) { return Math.min(3, Math.floor((/^\s*/.exec(s)[0].replace(/\t/g, "    ")).length / 2)); }

  while (i < src.length) {
    var line = src[i];

    if (/^\s*```/.test(line)) {
      close();
      var buf = [];
      i++;
      while (i < src.length && !/^\s*```/.test(src[i])) { buf.push(src[i]); i++; }
      i++;
      out.push('<pre class="code"><code>' + esc(buf.join("\n")) + "</code></pre>");
      continue;
    }
    if (/^\s*\|/.test(line)) {
      close();
      var tbl = [];
      while (i < src.length && /^\s*\|/.test(src[i])) { tbl.push(src[i]); i++; }
      out.push(mdTable(tbl));
      continue;
    }
    var h = /^(#{1,6})\s+(.*)$/.exec(line);
    if (h) {
      close();
      var lv = Math.min(6, h[1].length + 2);
      out.push("<h" + lv + ' class="md-h">' + inline(h[2]) + "</h" + lv + ">");
      i++;
      continue;
    }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { close(); out.push("<hr>"); i++; continue; }
    if (/^\s*>/.test(line)) {
      close();
      var quote = [];
      while (i < src.length && /^\s*>/.test(src[i])) { quote.push(src[i].replace(/^\s*>\s?/, "")); i++; }
      out.push("<blockquote>" + inline(quote.join(" ")) + "</blockquote>");
      continue;
    }
    var li = /^(\s*)[-*]\s+(.*)$/.exec(line);
    if (li) { open("ul"); out.push('<li class="lv' + depth(line) + '">' + inline(li[2]) + "</li>"); i++; continue; }
    var oli = /^(\s*)\d+\.\s+(.*)$/.exec(line);
    if (oli) { open("ol"); out.push('<li class="lv' + depth(line) + '">' + inline(oli[2]) + "</li>"); i++; continue; }
    if (!line.trim()) { close(); i++; continue; }

    close();
    var para = [line];
    i++;
    while (i < src.length && src[i].trim() && !RE_BLOCK.test(src[i])) { para.push(src[i]); i++; }
    out.push("<p>" + inline(para.join(" ")) + "</p>");
  }
  close();
  return out.join("");
}

/** 同じ色が横に続くところは1本の帯にする（1こま 410 点 → 127 本） */
function dots(rows, paint) {
  paint = paint || AIBO_PAINT;
  var out = [];
  for (var y = 0; y < rows.length; y++) {
    var line = rows[y];
    var x = 0;
    while (x < line.length) {
      var c = line[x];
      if (c === ".") { x++; continue; }
      var run = 1;
      while (x + run < line.length && line[x + run] === c) run++;
      out.push('<rect x="' + x + '" y="' + y + '" width="' + run + '" height="1" fill="' +
        paint[c] + '"/>');
      x += run;
    }
  }
  return out.join("");
}

function aibo(small) {
  var shut = AIBO_EYES.map(function (e) {
    var w = e[1] - e[0] + 1;
    return '<rect x="' + e[0] + '" y="6" width="' + w + '" height="3" fill="' + AIBO_PAINT.w + '"/>' +
      '<rect x="' + e[0] + '" y="7" width="' + w + '" height="1" fill="' + AIBO_PAINT.o + '"/>';
  }).join("");
  return '<svg class="aibo' + (small ? " small" : "") + '" viewBox="0 0 26 24" role="img" ' +
    'shape-rendering="crispEdges"><title>アイボ</title>' +
    '<g class="f1">' + dots(AIBO_A) + "</g>" +
    '<g class="f2">' + dots(AIBO_B) + "</g>" +
    '<g class="blink">' + shut + "</g></svg>";
}

function shepherd(small) {

    return '<rect x="' + e[0] + '" y="6" width="' + w + '" height="3" fill="' + SHEP_PAINT.k + '"/>' +
      '<rect x="' + e[0] + '" y="7" width="' + w + '" height="1" fill="' + SHEP_PAINT.o + '"/>';

    '<g class="f2">' + dots(SHEPHERD_B, SHEP_PAINT) + "</g>" +
    '<g class="blink">' + shut + "</g></svg>";
}

/**
 * よその日記を1枚描く。
 *
 * 書き手は**1匹**（シェパード）で、`by` はそれを走らせた機械の名前
 * —— 日記の `by: claude-opus-5` と同じ扱い。だから名前は絵の側に置いて、
 * 機械の名前は小さく添える。
 */
function saidBlock(c) {
  return '<div class="said"><div class="said-who">' + shepherd(true) +
    '<div class="aibo-who">シェパード</div></div>' +
    '<div class="said-body"><p class="who">よそから（' + esc(c.by) + "）</p>" +
    paragraphs(c.doc.body) + "</div></div>";
}

/**
 * 見立てを1枚描く。
 *
 * 書いたのはアイボ（日記と同じ相棒）なので、絵も同じ。`by` はそれを走らせた
 * 機械の名前で、日記の `by: claude-opus-5` と同じ扱い。
 */
function midateBlock(doc) {
  return '<div class="said"><div class="said-who">' + aibo(true) +
    '<div class="aibo-who">アイボ</div></div>' +
    '<div class="said-body"><p class="who">' +
    ((doc.fields && doc.fields.room === "おすすめ") ? "おすすめ" : "見立て") + "（" +
    esc((doc.fields && doc.fields.by) || "") + "）</p>" +
    paragraphs(doc.body) + "</div></div>";
}

/** 日記のとなりに座らせる */
function aiboBeside(html) {
  return '<div class="aibo-side"><div>' + aibo(false) +
    '<div class="aibo-who">アイボ</div></div>' + html + "</div>";
}

// ---------------------------------------------------------------- 部品

function bars(items, gold) {
  var max = Math.max.apply(null, items.map(function (i) { return i.value; }).concat([1]));
  return '<div class="bars">' + items.map(function (i) {
    var open = i.href ? '<a class="bar-row" href="' + esc(i.href) + '">' : '<div class="bar-row">';
    return open + '<span class="b-name">' + esc(i.name) + "</span>" +
      '<span class="b-track"><span class="b-fill' + (gold ? " gold" : "") +
      '" style="width:' + Math.max(1.5, (i.value / max) * 100).toFixed(2) + '%"></span></span>' +
      '<span class="b-num">' + esc(i.label != null ? i.label : num(i.value)) + "</span>" +
      (i.href ? "</a>" : "</div>");
  }).join("") + "</div>";
}

/**
 * つぎに日記が書かれる時刻。
 *
 * 日記を書かせるのは systemd のタイマーなので、これだけは拠点の外から来る。
 * 聞けなかったとき（`nightly` が null）は**何も言わない** —— 分からない
 * ことを、書かれない・書かれるのどちらにも寄せない。
 */
function nextRun(t) {
  if (!t) return "";
  if (!t.armed) {
    return '<span class="when">　／　定時便が仕掛けられていないので、つぎは決まっていない</span>';
  }
  var day = t.next.slice(0, 10);
  var now = new Date();
  var ymd = function (d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") +
      "-" + String(d.getDate()).padStart(2, "0");
  };
  var tomorrow = new Date(now.getTime() + 86400000);
  var when = day === ymd(now) ? "きょう" : day === ymd(tomorrow) ? "あす" : day;
  return '<span class="when">　／　つぎは ' + esc(when + " " + t.next.slice(11)) +
    (t.at ? esc("（毎晩 " + t.at + " の定時便）") : "") + "</span>";
}

function secHead(kicker, title, note) {
  return '<div class="sec-head"><p class="kicker">▶ ' + esc(kicker) + "</p>" +
    "<h2>" + esc(title) + "</h2>" + (note ? "<p>" + note + "</p>" : "") + "</div>";
}

function docHref(path) { return "#/doc/" + u(path); }
function treeHref(path) { return "#/tree/" + u(path || ""); }

/** 拠点の相対パスを、ひとつずつ辿れる形に */
function crumbs(path, isDir) {
  var parts = String(path || "").split("/").filter(Boolean);
  var out = ['<a href="' + treeHref("") + '">拠点</a>'];
  var at = "";
  parts.forEach(function (p, idx) {
    at = at ? at + "/" + p : p;
    var last = idx === parts.length - 1;
    out.push(last && !isDir ? esc(p) : '<a href="' + treeHref(at) + '">' + esc(p) + "</a>");
  });
  return '<div class="crumb">' + out.join(" ▸ ") + "</div>";
}

async function get(url) {
  var res = await fetch(url);
  var data = null;
  try { data = await res.json(); } catch (e) { data = null; }
  if (!res.ok) throw new Error(data && data.error ? data.error : res.statusText);
  return data;
}

function show(html) {
  document.getElementById("app").innerHTML = html;
  window.scrollTo(0, 0);
}

function fail(title, message) {
  show('<header class="head"><p class="kicker">＊ 鑑識 ＊</p><h1>' + esc(title) + "</h1>" +
    '<p class="sub err">' + esc(message) + "</p></header>");
}

// ---------------------------------------------------------------- まとめ

function renderSummary(s) {
  var out = [];

  out.push('<header class="head">');
  out.push('<p class="kicker">＊ 鑑識 ＊　' + esc(s.first) + " 〜 " + esc(s.last) + "</p>");
  out.push("<h1>じぶんを しらべる</h1>");
  // 「手で書いた部屋は一つもない」は、株の台帳（銘柄と株数）を置いた時点で
  // 嘘になる。持っているかどうかで言い分けて、どちらでも本当のことを言う。
  // 「ぜんぶログから」も `ニュース/`（外の見出し）を足した時点で嘘になった
  // —— 落とし穴66。部屋を足したら、この文も見る
  out.push('<p class="sub">' + esc(s.lead) +
    " <b>本人には聞かない。</b>残った痕跡から起こす —— " +
    (s.stock
      ? "手で書いたのは<b>持っている株の銘柄と株数</b>だけ。"
      : "<b>手で書いた部屋は一つもない。</b>") +
    "あとはログと、その日<b>外で話されていたこと</b>から機械が起こしたもの。" +
    "ここはまとめで、上の帯から<b>部屋ごとに潜って原文まで</b>読める。</p>");
  out.push('<div class="win status"><div class="st-grid">');
  s.stats.forEach(function (t) {
    out.push("<div><span>" + esc(t.label) + "</span><b>" + esc(t.value) + "</b></div>");
  });
  out.push("<div><span>スキル</span><b>" + num(s.skills) + "</b></div>");
  out.push("<div><span>週報</span><b>" + num(s.weeks) + "週</b></div>");
  out.push("<div><span>ぜんぶで</span><b>" + s.span + "年</b></div>");
  out.push("</div></div></header>");

  if (s.diary) {
    out.push("<section>");
    out.push(secHead("アイボの日記", esc(s.diaryDate) + " のこと",
      "その日の記録を読んで、横で見ていた側が書いたもの。ここだけ書き手が機械ではないので、" +
      "同じ日を二度書くと違うものになる。だから一度書いたら書き直さない。" +
      "ぜんぶで <b>" + num(s.diaries) + "</b> 日ぶん。"));
    out.push(aiboBeside('<div class="diary">' + paragraphs(s.diary.body) + "</div>"));
    // よその日記はアイボの日記の外に置く。同じ日を別々に書いた2枚なので、
    // 片方の一部に見えてはいけない（1枚を開いたときと同じ扱い）
    (s.diaryComments || []).forEach(function (c) { out.push(saidBlock(c)); });

function skillCard(t, maxYears) {
  var star = Math.max(1, Math.round((t.years / maxYears) * 5));
  return '<a class="tk" href="' + docHref(t.path || ("プロフィール/スキル/" + t.name + ".md")) + '">' +
    '<div class="tk-top"><span class="tk-name">' + esc(t.name) + "</span>" +
    '<span class="tk-star">' + "★".repeat(star) + "<i>" + "★".repeat(5 - star) + "</i></span></div>" +
    '<div class="tk-when">' + esc(t.first) + " 〜 " + esc(t.last) + "　" + t.years + "年</div>" +
    '<div class="tk-num">記事 ' + num(t.articles) + "　ファイル " + num(t.files) + "</div></a>";
}

var MONTHS = ["一月", "二月", "三月", "四月", "五月", "六月",
  "七月", "八月", "九月", "十月", "十一月", "十二月"];

/**
 * 年表を描く。年で束ねて、その中を月で束ねる。
 *
 * 新しい年が上（この画面のほかの一覧と同じ向き）。1つの月の中だけは
 * 書かれたとおりの順（古い順）で、そこが出来事の流れになる。
 */
function renderNenpyo(months, years0) {
  // 年の合計は `プロフィール/年表/` から借りる。書けている月を足し上げると、
  // まだ書いていない月のぶん少ない数になって、同じ年について2つの数が
  // 出てしまう（落とし穴21）
  var total = {};
  years0.forEach(function (y) { total[String(y.year)] = y; });
  var byYear = {};
  var years = [];
  months.forEach(function (m) {
    var y = m.month.slice(0, 4);
    if (!byYear[y]) { byYear[y] = []; years.push(y); }
    byYear[y].push(m);
  });
  years.sort().reverse();

  var out = [];
  years.forEach(function (y) {
    var inYear = byYear[y].slice().sort(function (a, b) {
      return b.month.localeCompare(a.month);
    });
    var sum = total[y];
    var counts = [];
    if (sum) {
      if (sum.commits) counts.push("コミット " + num(sum.commits));
      if (sum.articles) counts.push("記事 " + num(sum.articles));
    }
    if (inYear.length < 12) counts.push("書けた月 " + num(inYear.length));
    out.push('<div class="nen-y"><h3>' + esc(y) + "</h3>" +
      '<span class="n">' + esc(counts.join(" / ")) + "</span>" +
      '<a class="go" href="' + docHref("プロフィール/年表/" + y + ".md") + '">かずで見る ▶</a></div>');

    inYear.forEach(function (m) {
      var mi = parseInt(m.month.slice(5, 7), 10) - 1;
      out.push('<div class="nen-m">');
      out.push('<div class="nen-mon">' + esc(MONTHS[mi] || m.month) +
        "<i>" + esc(m.month) + "</i></div>");
      out.push('<div class="nen-in">');
      if (m.lead) out.push('<p class="nen-lead">' + esc(m.lead) + "</p>");
      m.events.forEach(function (e) {
        out.push('<a class="ev' + (e.big ? " big" : "") + '" href="' + docHref(m.path) + '">' +
          "<time>" + esc(e.date.replace("-", ".")) + "</time>" +
          "<b>" + esc(e.name) + "</b>" +
          (e.note ? '<span class="say">' + esc(e.note) + "</span>" : "") + "</a>");
      });
      if (m.tail) out.push('<p class="nen-tail">' + esc(m.tail) + "</p>");
      out.push("</div></div>");
    });
  });
  return out.join("");
}

function placeCard(p) {
  return '<a class="bs" href="' + docHref(p.path) + '"><div class="bs-name">' + esc(p.name) + "</div>" +
    '<div class="bs-when">' + esc(p.first) + " 〜 " + esc(p.last) + "</div>" +
    '<div class="bs-num">会話 ' + num(p.sessions) + "　コミット " + num(p.commits) + "</div></a>";
}

function renderList(kind, items, extra) {
  var meta = LISTS[kind];
  // note は画面に直に書いてある文字列。ほかの secHead と同じく HTML のまま渡す
  var head = secHead(meta.kicker + "　" + num(items.length), meta.title, meta.note);
  var out = ['<section>'];
  var byAibo = kind === "diary" || kind === "events";
  out.push(byAibo ? '<div class="aibo-row">' + aibo(true) + head + "</div>" : head);

  if (kind === "diary") {
    out.push('<div class="rows">');
    items.slice().reverse().forEach(function (d) {
      // よその犬は1匹なので、`readBy`（機械の名前）は数えるだけで名前は出さない
      var read = (d.readBy || []).length ? '<span class="said-tag">よそも書いた</span>' : "";
      out.push('<a class="row" href="' + docHref(d.path) + '">' +
        '<span class="r-key">' + esc(d.date) + "</span>" +
        '<span class="r-body">' + esc(d.lead) + "</span>" + read +
        '<span class="r-num">' + esc(d.by) + "</span></a>");
    });
    out.push("</div>");
  } else if (kind === "stock" && !items.length) {
    // 株だけは「まだ無い」が既定の状態なので、始めかたを出す
    out.push('<div class="doc"><p>まだ1日も書かれていません。' +
      '持っているものを <code>拠点/株/保有.md</code> に置くと、' +
      'ここに確定した終値が積まれます（雛形は <code>bin/stock.ts --init</code>）。</p></div>');
  } else if (kind === "stock") {
    var maxV = Math.max.apply(null, items.map(function (d) { return d.value; }).concat([1]));
    out.push('<div class="rows">');
    items.slice().reverse().forEach(function (d) {
      // 見立ては「その日に言ってある」印。日記の「よそも書いた」と同じ扱い
      var said = d.said ? '<span class="said-tag">見立てあり</span>' : "";
      // 損益は null（取得単価が無い）と 0 を分ける。0 にすると「損も得もない」に化ける
      var gain = d.gain === null ? "—"
        : (d.gain >= 0 ? "+" : "-") + num(Math.abs(d.gain)) + "円";
      out.push('<a class="row" href="' + docHref(d.path) + '">' +
        '<span class="r-key">' + esc(d.date) + "</span>" +
        '<span class="r-body">' + num(d.value) + "円　" + esc(gain) + "</span>" + said +
        '<span class="r-track"><i style="width:' + ((d.value / maxV) * 100).toFixed(2) + '%"></i></span>' +
        '<span class="r-num">' + num(d.holdings) + "</span></a>");
    });
    out.push("</div>");
  } else if (kind === "news") {
    var maxN = Math.max.apply(null, items.map(function (d) { return d.hn + d.hatena; }).concat([1]));
    out.push('<div class="rows">');
    items.slice().reverse().forEach(function (d) {
      // おすすめは「その日に選んである」印。株の「見立てあり」と同じ扱い
      var said = d.said ? '<span class="said-tag">おすすめあり</span>' : "";
      var n2 = d.hn + d.hatena;
      out.push('<a class="row" href="' + docHref(d.path) + '">' +
        '<span class="r-key">' + esc(d.date) + "</span>" +
        '<span class="r-body">HN ' + num(d.hn) +
        (d.hatena ? "　はてブ " + num(d.hatena) : "") + "</span>" + said +
        '<span class="r-track"><i style="width:' + ((n2 / maxN) * 100).toFixed(2) + '%"></i></span>' +
        '<span class="r-num">' + num(n2) + "</span></a>");
    });
    out.push("</div>");
  } else if (kind === "reading") {
    var maxL = Math.max.apply(null, items.map(function (d) { return d.links; }).concat([1]));
    out.push('<div class="rows">');
    items.slice().reverse().forEach(function (d) {
      // どこから起こしたか。履歴とシェアは別のことなので混ぜずに出す
      var how = d.sources.map(function (x) {
        return x === "chrome" ? "ひらいた" : "シェアした";
      }).join("・");
      out.push('<a class="row" href="' + docHref(d.path) + '">' +
        '<span class="r-key">' + esc(d.date) + "</span>" +
        '<span class="r-body">' + esc(how) + "</span>" +
        '<span class="r-track"><i style="width:' + ((d.links / maxL) * 100).toFixed(2) + '%"></i></span>' +
        '<span class="r-num">' + num(d.links) + "</span></a>");
    });
    out.push("</div>");
  } else if (kind === "weekly" || kind === "trend") {
    var max = Math.max.apply(null, items.map(function (w) { return w.commits; }).concat([1]));
    out.push('<div class="rows">');
    items.slice().reverse().forEach(function (w) {
      out.push('<a class="row" href="' + docHref(w.path) + '">' +
        '<span class="r-key">' + esc(w.week) + "</span>" +
        '<span class="r-body">' + esc(w.from) + " 〜 " + esc(w.to) +
        (w.projects ? "　プロジェクト " + num(w.projects) : "") + "</span>" +
        '<span class="r-track"><i style="width:' + ((w.commits / max) * 100).toFixed(2) + '%"></i></span>' +
        '<span class="r-num">' + (w.commits ? num(w.commits) : "") + "</span></a>");
    });
    out.push("</div>");
  } else if (kind === "skill") {
    var maxYears = Math.max.apply(null, items.map(function (t) { return t.years; }).concat([1]));
    out.push('<div class="skills">');
    items.forEach(function (t) { out.push(skillCard(t, maxYears)); });
    out.push("</div>");
  } else if (kind === "events") {
    out.push(renderNenpyo(items, extra || []));
  } else if (kind === "timeline") {
    var maxC = Math.max.apply(null, items.map(function (a) { return a.commits; }).concat([1]));
    out.push('<div class="rows">');
    items.slice().reverse().forEach(function (a) {
      out.push('<a class="row" href="' + docHref(a.path) + '">' +
        '<span class="r-key">' + a.year + "</span>" +
        '<span class="r-body">' + esc(a.lead) + "</span>" +
        '<span class="r-track"><i style="width:' + ((a.commits / maxC) * 100).toFixed(2) + '%"></i></span>' +
        '<span class="r-num">' + num(a.commits) + "</span></a>");
    });
    out.push("</div>");
  } else {
    out.push('<div class="basho">');
    items.forEach(function (p) { out.push(placeCard(p)); });
    out.push("</div>");
  }
  out.push("</section>");
  show(out.join(""));
}

    t.dirs.forEach(function (d) {
      out.push('<a class="dir" href="' + treeHref(d.path) + '">' +
        '<div class="d-name">' + esc(d.name) + "</div>" +
        '<div class="d-num">' + num(d.count) + " 枚</div></a>");
    });
    out.push("</div>");
  }
  if (t.docs.length) {
    out.push('<div class="rows">');
    t.docs.forEach(function (d) {
      out.push('<a class="row" href="' + docHref(d.path) + '">' +
        '<span class="r-body">' + esc(d.name) + "</span>" +
        '<span class="r-num">' + esc(d.note) + "</span></a>");
    });
    out.push("</div>");
  }
  if (!t.dirs.length && !t.docs.length) out.push('<p class="note">ここには何もない。</p>');
  out.push("</section>");
  show(out.join(""));
}

  var fields = Object.keys(doc.fields || {});
  var out = ["<section>"];
  out.push(crumbs(doc.path, false));
  var room = (doc.fields && doc.fields.room) || "拠点";
  var head = '<div class="sec-head"><p class="kicker">▶ ' + esc(room) + "</p>" +
    "<h2>" + esc(doc.title || doc.path) + "</h2>" +
    (fields.length
      ? '<div class="fm">' + fields.map(function (k) {
        return "<span>" + esc(k) + " " + esc(doc.fields[k]) + "</span>";
      }).join("") + "</div>"
      : "") + "</div>";
  // 日記だけは書いたやつが横にいる
  out.push(room === "日記" ? '<div class="aibo-row">' + aibo(true) + head + "</div>" : head);
  out.push('<div class="tools" style="margin:0 0 16px">' +
    '<button class="btn on" id="as-md">よみもの</button>' +
    '<button class="btn" id="as-raw">原文</button></div>');
  out.push('<div class="doc" id="body">' + md(doc.body) + "</div>");
  // よその日記は本文の外に置く。「原文」に切り替えても消えないし、
  // アイボの日記の一部としても混ざらない —— 別々に書いた2枚なので
  (doc.comments || []).forEach(function (c) { out.push(saidBlock(c)); });
  // 見立ても本文の外。値は機械が数えたもので、見立てはそれを見てアイボが
  // 言ったもの —— 同じ紙に混ぜない（日記とよその日記の関係と同じ）
  if (doc.outlook) out.push(midateBlock(doc.outlook));
  out.push("</section>");
  show(out.join(""));

  document.getElementById("as-raw").onclick = async function () {
    this.classList.add("on");
    document.getElementById("as-md").classList.remove("on");
    var got = await get("/api/raw?path=" + u(doc.path));
    var el = document.getElementById("body");
    el.className = "raw";
    el.innerHTML = "<pre>" + esc(got.text) + "</pre>";
  };
  document.getElementById("as-md").onclick = function () {
    this.classList.add("on");
    document.getElementById("as-raw").classList.remove("on");
    var el = document.getElementById("body");
    el.className = "doc";
    el.innerHTML = md(doc.body);
  };
}

// ---------------------------------------------------------------- さがす

var ROOMS = ["会話", "自分", "アイボ", "日記", "よその日記", "出来事", "ニュース", "おすすめ", "読んだ", "投稿", "作業", "株", "見立て", "事典", "プロフィール", "週報", "アーカイブ"];
var findRoom = "";

async function renderSearch(q) {
  document.getElementById("q").value = q;
  var got = await get("/api/search?q=" + u(q) + (findRoom ? "&room=" + u(findRoom) : "") + "&limit=80");
  var out = ["<section>"];
  out.push(secHead("さがす　" + num(got.hits.length) + (got.hits.length >= 80 ? "+" : ""), q,
    "拠点に写した場所だけが引ける。無ければ「拠点には無い」が答えになる。"));

  out.push('<div class="chips">');
  out.push('<a class="btn' + (findRoom ? "" : " on") + '" href="#/search/' + u(q) + '" data-room="">ぜんぶ</a>');
  ROOMS.forEach(function (r) {
    out.push('<a class="btn' + (findRoom === r ? " on" : "") + '" href="#/search/' + u(q) +
      "/" + u(r) + '">' + esc(r) + "</a>");
  });
  out.push("</div>");

  if (got.note) out.push('<p class="note err">' + esc(got.note) + "</p>");
  if (got.fallback) out.push('<p class="note">（3文字未満の語があるので部分一致で引きました）</p>');
  if (!got.hits.length && !got.note) out.push('<p class="note">みつかりませんでした。</p>');

  got.hits.forEach(function (h) {
    var where = [h.date, h.project, h.room].filter(Boolean).join(" · ");
    out.push('<a class="hit" href="' + docHref(h.path) + '">' +
      '<div class="h-where">' + esc(where) + "</div>" +
      '<div class="h-head">' + light(esc(h.heading || "（見出しなし）"), got.words) + "</div>" +
      '<div class="h-snip">' + light(esc(h.snippet), got.words) + "</div></a>");
  });
  out.push("</section>");
  show(out.join(""));
}

// ---------------------------------------------------------------- 行き先

/** 拠点の住所 → うわばりのどの札か */
var OF_ROOM = [
  ["プロフィール/スキル", "#/list/skill"],
  ["プロフィール/年表", "#/list/events"],
  ["出来事", "#/list/events"],
  ["プロフィール/推移", "#/list/trend"],
  ["日記", "#/list/diary"],
  ["よその日記", "#/list/diary"],
  ["株", "#/list/stock"],
  ["見立て", "#/list/stock"],
  ["ニュース", "#/list/news"],
  ["おすすめ", "#/list/news"],
  ["読んだ", "#/list/reading"],
  ["週報", "#/list/weekly"],
  ["事典", "#/list/entity"],
  ["アーカイブ", treeHref("アーカイブ")],
];

function navOf(hash) {
  if (hash === "#/" || hash === "") return "#/";
  // 数で見た年表（`#/list/timeline`）は札を持たないので、年表の札を光らせる
  if (hash === "#/list/timeline") return "#/list/events";
  if (hash.indexOf("#/list/") === 0) return hash.split("/").slice(0, 3).join("/");
  if (hash.indexOf("#/doc/") === 0) {
    var path = unurl(hash.slice(6));
    for (var i = 0; i < OF_ROOM.length; i++) {
      if (path.indexOf(OF_ROOM[i][0] + "/") === 0) return OF_ROOM[i][1];
    }
    return "#/tree/";
  }
  if (hash.indexOf("#/tree/") === 0) {
    var treePath = unurl(hash.slice(7));
    if (treePath === "アーカイブ" || treePath.indexOf("アーカイブ/") === 0) {
      return treeHref("アーカイブ");
    }
    return "#/tree/";
  }
  return "";
}

function mark(hash) {
  var want = navOf(hash);
  document.querySelectorAll(".bar a.nav").forEach(function (a) {
    a.classList.toggle("on", a.getAttribute("href") === want);
  });
}

async function route() {
  var hash = location.hash || "#/";
  mark(hash);
  var parts = hash.slice(2).split("/");
  var kind = parts.shift();
  var rest = parts.join("/");

  try {
    if (!kind) {
      var s = await get("/api/summary");
      if (!s) throw new Error("拠点にプロフィールがありません");
      renderSummary(s);
      return;
    }
    if (kind === "list") {
      var items = await get("/api/list?room=" + u(rest));
      // 年表は年の合計を `プロフィール/年表/` から借りるので、そちらも取る
      renderList(rest, items, rest === "events" ? await get("/api/list?room=timeline") : null);
      return;
    }
    if (kind === "tree") {
      renderTree(await get("/api/tree?path=" + u(unurl(rest))));
      return;
    }
    if (kind === "doc") {
      renderDoc(await get("/api/doc?path=" + u(unurl(rest))));
      return;
    }
    if (kind === "search") {
      // #/search/<語>/<部屋>
      var seg = rest.split("/");
      findRoom = seg.length > 1 ? unurl(seg[1]) : "";
      await renderSearch(unurl(seg[0] || ""));
      return;
    }
    fail("そんな部屋はない", hash);
  } catch (err) {
    fail("読めません", err.message);
  }
}

document.getElementById("find").onsubmit = function (ev) {
  ev.preventDefault();
  var q = document.getElementById("q").value.trim();
  if (!q) return;
  findRoom = "";
  location.hash = "#/search/" + u(q);
  if (location.hash === "#/search/" + u(q)) route();
};

document.addEventListener("keydown", function (ev) {
  if (ev.key !== "/" || ev.metaKey || ev.ctrlKey) return;
  var el = document.activeElement;
  if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) return;
  ev.preventDefault();
  document.getElementById("q").focus();
});

window.addEventListener("hashchange", route);
route();
</script>
